    //Google Identity Services
    <script async defer src="https://apis.google.com/js/api.js">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
    
    </script>

    <script type="module">
        import * as THREE from 'three';

        import {
            CSS3DRenderer,
            CSS3DObject
        } from 'three/addons/renderers/CSS3DRenderer.js';

        import {
            TrackballControls
        } from 'three/addons/controls/TrackballControls.js';

        /* =====================================================
           GOOGLE CONFIGURATION
        ===================================================== */

        const CONFIG = {
            CLIENT_ID:
                '49516764900-hl8benurb7sknbn1b36h0j7fa52iu8am.apps.googleusercontent.com',

            API_KEY:
                'AIzaSyCnj3VDnj8ZkdFcK7sE1sepPwh4svFRiCM',

            SPREADSHEET_ID:
                '1fGA23_43cB905azobRWAA7eNfMm2JnnOQhOPnPoq0A4',

            RANGE:
                'Data Template!A1:F201'

        };

        const DISCOVERY_DOC =
            'https://sheets.googleapis.com/$discovery/rest?version=v4';

        const SCOPES =
            'https://www.googleapis.com/auth/spreadsheets.readonly';

        let tokenClient;

        let gapiInited = false;

        let gisInited = false;

        let googleInitialized = false;

        let camera;

        let scene;

        let renderer;

        let controls;

        let objects = [];


        let targets = {

            table: [],

            sphere: [],

            helix: [],

            grid: [],

            tetrahedron: []

        };

        init();

        animate();

        function init() {

            camera = new THREE.PerspectiveCamera(
                40,
                window.innerWidth /
                window.innerHeight,
                1,
                10000
            );

            camera.position.z = 3000;
            scene = new THREE.Scene();
            renderer =
                new CSS3DRenderer();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            document
                .getElementById('container')
                .appendChild(
                    renderer.domElement
                );

            controls =
                new TrackballControls(
                    camera,
                    renderer.domElement
                );

            controls.rotateSpeed = 0.5;
            controls.minDistance = 700;
            controls.maxDistance = 6000;

            controls.addEventListener(
                'change',
                render
            );

            document
                .getElementById('table')
                .addEventListener(
                    'click',
                    () => {
                        transform(
                            targets.table,
                            1500
                        );
                    }
                );


            document
                .getElementById('sphere')
                .addEventListener(
                    'click',
                    () => {
                        transform(
                            targets.sphere,
                            1500
                        );
                    }
                );

            document
                .getElementById('helix')
                .addEventListener(
                    'click',
                    () => {
                        transform(
                            targets.helix,
                            1500
                        );
                    }
                );

            document
                .getElementById('grid')
                .addEventListener(
                    'click',
                    () => {
                        transform(
                            targets.grid,
                            1500
                        );
                    }
                );

            document
                .getElementById('tetrahedron')
                .addEventListener(
                    'click',
                    () => {
                        transform(
                            targets.tetrahedron,
                            1500
                        );
                    }
                );

            window.addEventListener(
                'resize',
                onWindowResize
            );

            // Initialize Google APIs separately

            // Google Sheets API
            const checkGapi = setInterval(() => {

                if (window.gapi) {

                    clearInterval(checkGapi);

                    gapi.load(
                        'client',
                        initializeGapiClient
                    );

                }

            }, 100);

            // Google Identity Services
            initializeGoogle();
        }

        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            try {
                await gapi.client.init({
                    apiKey: CONFIG.API_KEY,
                    discoveryDocs: [DISCOVERY_DOC]
                });

                gapiInited = true;
                console.log("Google Sheets API initialized successfully.");

            } catch (error) {
                console.error("GAPI initialization failed:", error);

                document.getElementById('status').textContent =
                    'Google API initialization failed.';
            }
        }

        function initializeGIS() {

            try {

                // OAuth token client for Google Sheets
                tokenClient =
                    google.accounts.oauth2.initTokenClient({

                        client_id: CONFIG.CLIENT_ID,

                        scope: SCOPES,

                        callback: ''
                    });

                gisInited = true;

                // Initialize Google Sign-In immediately
                google.accounts.id.initialize({

                    client_id: CONFIG.CLIENT_ID,

                    callback: handleCredentialResponse

                });

                // Render Google Sign-In button
                google.accounts.id.renderButton(

                    document.getElementById(
                        'welcomeGoogleButton'
                    ),

                    {
                        theme: 'outline',
                        size: 'large',
                        text: 'signin_with',
                        shape: 'rectangular',
                        width: 260
                    }

                );

                console.log(
                    'Google Sign-In initialized successfully.'
                );

            }
            catch (error) {

                console.error(
                    'GIS initialization failed:',
                    error
                );

                document.getElementById(
                    'status'
                ).textContent =
                    'Google Sign-In initialization failed.';

            }

        }

        function initializeGoogle() {

            const checkGoogle = setInterval(() => {

                // Google Identity Services
                if (
                    window.google &&
                    window.google.accounts &&
                    window.google.accounts.id
                ) {

                    clearInterval(checkGoogle);

                    initializeGIS();

                }

            }, 100);

        }

        // Google Login
        function handleCredentialResponse(response) {

            console.log(
                'Google account selected successfully.'
            );

            document.getElementById(
                'status'
            ).textContent =
                'Google account selected. Please authorize Google Sheets.';

            // Hide welcome screen
            document.getElementById(
                'welcomeOverlay'
            ).style.display = 'none';

            // Hide old Google button
            document.getElementById(
                'googleButton'
            ).style.display = 'none';

            // Show Google Sheets authorization
            document.getElementById(
                'authorizeButton'
            ).style.display = 'inline-block';

            // Sign Out remains hidden
            document.getElementById(
                'signout'
            ).style.display = 'none';

            document.getElementById(
                'authorizeButton'
            ).onclick =
                requestSheetsAccess;

        }

        function requestSheetsAccess() {

            if (!gapiInited) {

                document.getElementById(
                    'status'
                ).textContent =
                    'Google Sheets API is still initializing. Please try again.';

                return;
            }

            tokenClient.callback = async response => {

                if (response.error) {

                    console.error(
                        'Google Sheets authorization error:',
                        response
                    );

                    document.getElementById(
                        'status'
                    ).textContent =
                        'Google Sheets authorization failed.';

                    return;
                }

                // Set OAuth token
                gapi.client.setToken(response);

                // Hide authorization button
                document.getElementById(
                    'authorizeButton'
                ).style.display = 'none';

                document.getElementById(
                    'status'
                ).textContent =
                    'Loading Google Sheet...';

                // Load spreadsheet
                await loadGoogleSheet();

            };

            tokenClient.requestAccessToken({

                prompt: 'consent'

            });

        }

        // Google Sheet
        async function loadGoogleSheet() {

            try {

                const response =
                    await gapi.client
                        .sheets.spreadsheets.values
                        .get({

                            spreadsheetId:
                                CONFIG.SPREADSHEET_ID,

                            range:
                                CONFIG.RANGE

                        });

                const values =
                    response.result.values;

                if (
                    !values ||
                    values.length < 2
                ) {

                    throw new Error(
                        'No spreadsheet data found.'
                    );

                }

                const records = [];

                for (
                    let i = 1;
                    i < values.length;
                    i++
                ) {

                    const row = values[i];

                    const person = {

                        name:
                            row[0] || '',

                        photo:
                            row[1] || '',

                        age:
                            Number(row[2]) || 0,

                        country:
                            row[3] || '',

                        interest:
                            row[4] || '',

                        netWorth:
                            parseNetWorth(row[5])

                    };

                    if (person.name) {

                        records.push(person);

                    }

                }

                // Create 3D objects
                createObjects(records);

                // Show visualization
                document.getElementById(
                    'container'
                ).style.visibility = 'visible';

                // Show Sign Out
                document.getElementById(
                    'signout'
                ).style.display = 'inline-block';

                document.getElementById(
                    'status'
                ).textContent =
                    `Loaded ${records.length} records from Google Sheets.`;

                render();

            }
            catch (error) {

                console.error(
                    'Google Sheet loading failed:',
                    error
                );

                document.getElementById(
                    'container'
                ).style.visibility = 'hidden';

                document.getElementById(
                    'signout'
                ).style.display = 'none';

                document.getElementById(
                    'status'
                ).textContent =
                    'Failed to load Google Sheet. Check permissions and configuration.';

            }

        }

        function parseNetWorth(value) {

            return Number(

                String(value)

                    .replace(
                        /\$/g,
                        ''
                    )

                    .replace(
                        /,/g,
                        ''
                    )

                    .trim()

            ) || 0;

        }

        // Create 3D obj
        function createObjects(data) {
            // To remove previous obj
            objects.forEach(

                object => {
                    scene.remove(
                        object
                    );

                }

            );

            objects = [];
            targets = {
                table: [],
                sphere: [],
                helix: [],
                grid: [],
                tetrahedron: []
            };

            // Create each person tile
            for (
                let i = 0;
                i < data.length;
                i++
            ) {

                const person =
                    data[i];

                const element =
                    document.createElement(
                        'div'
                    );

                element.className =
                    'element';
                /*
                 * Net Worth  Background Color:
                 * Red    < $100K
                 * Orange > $100K
                 * Green  > $200K
                 */

                if (
                    person.netWorth < 100000

                ) {
                    element.style.background =
                        'rgba(180, 30, 30, 0.85)';

                }

                else if (
                    person.netWorth > 200000

                ) {
                    element.style.background =
                        'rgba(30, 150, 60, 0.85)';

                }

                else {
                    element.style.background =
                        'rgba(220, 120, 20, 0.85)';

                }

                //Photo
                if (person.photo) {

                    const image =
                        document.createElement(
                            'img'
                        );

                    image.className =
                        'photo';

                    image.src =
                        person.photo;

                    image.onerror =
                        function () {

                            this.style.display =
                                'none';

                        };

                    element.appendChild(
                        image
                    );
                }

                const name =
                    document.createElement(
                        'div'
                    );

                name.className =
                    'name';

                name.textContent =
                    person.name;

                element.appendChild(
                    name
                );

                const details =
                    document.createElement(
                        'div'
                    );

                details.className =
                    'details';

                details.innerHTML =

                    'Age: ' +
                    escapeHTML(
                        person.age
                    ) +

                    '<br>Country: ' +
                    escapeHTML(
                        person.country
                    ) +

                    '<br>Interest: ' +
                    escapeHTML(
                        person.interest
                    ) +

                    '<div class="worth">' +

                    'Net Worth: $' +

                    person.netWorth
                        .toLocaleString() +

                    '</div>';

                element.appendChild(
                    details
                );

                const object =
                    new CSS3DObject(
                        element
                    );

                object.position.x =
                    Math.random() * 4000 -
                    2000;

                object.position.y =
                    Math.random() * 4000 -
                    2000;

                object.position.z =
                    Math.random() * 4000 -
                    2000;

                scene.add(object);
                objects.push(object);

            }

            //To generate the layout
            createTable();
            createSphere();
            createDoubleHelix();
            createGrid();
            createTetrahedron();

            //Start from table
            transform(
                targets.table,
                0
            );
        }

        //Table
        function createTable() {

            const columns = 10;
            const horizontalSpacing = 145;
            const verticalSpacing = 175;

            const rows = Math.ceil(objects.length / columns);

            for (
                let i = 0;
                i < objects.length;
                i++
            ) {

                const object = new THREE.Object3D();

                const column = i % columns;
                const row = Math.floor(i / columns);

                object.position.x =
                    column * horizontalSpacing -
                    ((columns - 1) * horizontalSpacing) / 2;

                object.position.y =
                    -row * verticalSpacing +
                    ((rows - 1) * verticalSpacing) / 2;

                object.position.z = 0;

                targets.table.push(object);
            }
        }

        //Sphere
        function createSphere() {

            const vector =
                new THREE.Vector3();

            for (
                let i = 0;
                i < objects.length;
                i++

            ) {

                const phi =
                    Math.acos(
                        -1 +
                        (2 * i) /
                        objects.length

                    );

                const theta =
                    Math.sqrt(
                        objects.length *
                        Math.PI
                    ) * phi;

                const object =
                    new THREE.Object3D();

                object.position
                    .setFromSphericalCoords(
                        750,
                        phi,
                        theta
                    );

                vector.copy(
                    object.position
                ).multiplyScalar(2);

                object.lookAt(
                    vector
                );

                targets.sphere.push(
                    object
                );
            }
        }

        // Double helix
        function createDoubleHelix() {
            const radius = 950;
            const verticalStep = 65;
            const angleStep = 0.20;

            for (
                let i = 0;
                i < objects.length;
                i++

            ) {
                const strand =
                    i % 2;

                const index =
                    Math.floor(i / 2);

                const angle =
                    index * angleStep +
                    strand * Math.PI;

                const object =
                    new THREE.Object3D();

                object.position.x =

                    radius *
                    Math.cos(angle);

                object.position.y =

                    -(index * verticalStep) +

                    2250;

                object.position.z =

                    radius *
                    Math.sin(angle);

                const lookAt =
                    new THREE.Vector3(

                        object.position.x * 2,

                        object.position.y,

                        object.position.z * 2

                    );

                object.lookAt(
                    lookAt
                );

                targets.helix.push(
                    object
                );

            }

        }

        //Modified grid size
        function createGrid() {

            for (
                let i = 0;
                i < objects.length;
                i++
            ) {

                const object =
                    new THREE.Object3D();

                object.position.x =
                    (i % 5) * 300 -
                    600;

                object.position.y =
                    -(Math.floor(i / 5) % 4) *
                    300 +
                    450;

                object.position.z =
                    Math.floor(i / 20) * 350 -
                    1575;

                targets.grid.push(
                    object
                );

            }

        }

        // Tetrahedron
        function createTetrahedron() {

            // Smaller tetrahedron so the larger cards remain visible
            const size = 950;

            // Four vertices
            const vertices = [
                new THREE.Vector3(
                    0,
                    size,
                    0
                ),

                new THREE.Vector3(
                    -size,
                    -size * 0.45,
                    size * 0.75
                ),

                new THREE.Vector3(
                    size,
                    -size * 0.45,
                    size * 0.75
                ),

                new THREE.Vector3(
                    0,
                    -size * 0.45,
                    -size
                )
            ];

            // Four triangular faces
            const faces = [
                [0, 1, 2],
                [0, 2, 3],
                [0, 3, 1],
                [1, 3, 2]
            ];

            let resolution = 3;
            let allFacePoints = [];

            while (true) {

                allFacePoints = [];

                for (
                    let faceIndex = 0;
                    faceIndex < faces.length;
                    faceIndex++
                ) {

                    const a =
                        vertices[faces[faceIndex][0]];

                    const b =
                        vertices[faces[faceIndex][1]];

                    const c =
                        vertices[faces[faceIndex][2]];

                    // Calculate face normal
                    const edge1 =
                        new THREE.Vector3()
                            .subVectors(b, a);

                    const edge2 =
                        new THREE.Vector3()
                            .subVectors(c, a);

                    const normal =
                        new THREE.Vector3()
                            .crossVectors(
                                edge1,
                                edge2
                            )
                            .normalize();

                    const points = [];
                    const margin = 0.12;

                    for (
                        let row = 0;
                        row <= resolution;
                        row++
                    ) {

                        for (
                            let column = 0;
                            column <= resolution - row;
                            column++
                        ) {

                            const u =
                                column / resolution;

                            const v =
                                row / resolution;

                            const w =
                                1 - u - v;

                            // Keep cards away from edges
                            if (
                                u < margin ||
                                v < margin ||
                                w < margin
                            ) {
                                continue;
                            }

                            const point =
                                new THREE.Vector3();

                            point
                                .addScaledVector(a, w)
                                .addScaledVector(b, u)
                                .addScaledVector(c, v);

                            points.push({
                                position: point,
                                normal: normal.clone()
                            });
                        }
                    }

                    allFacePoints.push(points);
                }

                const totalPoints =
                    allFacePoints.reduce(
                        (sum, face) =>
                            sum + face.length,
                        0
                    );

                // Enough positions generated
                if (
                    totalPoints >= objects.length
                ) {
                    break;
                }

                // Increase resolution
                resolution++;
            }

            console.log(
                `Tetrahedron resolution: ${resolution}`
            );

            console.log(
                `Available positions: ${allFacePoints.reduce(
                    (sum, face) =>
                        sum + face.length,
                    0
                )
                }`
            );

            console.log(
                `Required positions: ${objects.length}`
            );

            const totalObjects =
                objects.length;

            const baseCount =
                Math.floor(
                    totalObjects / 4
                );

            const remainder =
                totalObjects % 4;

            let objectIndex = 0;

            for (
                let faceIndex = 0;
                faceIndex < 4;
                faceIndex++
            ) {

                const faceCount =
                    baseCount +
                    (
                        faceIndex < remainder
                            ? 1
                            : 0
                    );

                const points =
                    allFacePoints[faceIndex];

                for (
                    let i = 0;
                    i < faceCount;
                    i++
                ) {

                    if (
                        objectIndex >=
                        objects.length
                    ) {
                        break;
                    }

                    const point =
                        points[i];

                    const object =
                        new THREE.Object3D();

                    // Position
                    object.position.copy(
                        point.position
                    );

                    // Make the card face outward
                    const lookAt =
                        new THREE.Vector3()
                            .copy(point.position)
                            .add(point.normal);

                    object.lookAt(
                        lookAt
                    );

                    targets.tetrahedron.push(
                        object
                    );

                    objectIndex++;
                }
            }

            console.log(
                `Tetrahedron layout: ${targets.tetrahedron.length
                } positions for ${objects.length
                } records.`
            );
        }

        //Transform layer
        function transform(
            targetArray,
            duration
        ) {

            for (
                let i = 0;
                i < objects.length;
                i++
            ) {

                const object =
                    objects[i];

                const target =
                    targetArray[i];

                const startPosition =
                    object.position.clone();

                const startRotation =
                    object.rotation.clone();

                const startTime =
                    Date.now();

                function animateObject() {
                    const elapsed =
                        Date.now() -
                        startTime;

                    const progress =
                        duration === 0
                            ? 1
                            : Math.min(
                                elapsed /
                                duration,
                                1
                            );


                    const eased =
                        1 -
                        Math.pow(
                            1 - progress,
                            3
                        );

                    object.position.lerpVectors(
                        startPosition,
                        target.position,
                        eased
                    );


                    object.rotation.x =
                        startRotation.x +
                        (
                            target.rotation.x -
                            startRotation.x
                        ) * eased;


                    object.rotation.y =
                        startRotation.y +
                        (
                            target.rotation.y -
                            startRotation.y
                        ) * eased;


                    object.rotation.z =
                        startRotation.z +
                        (
                            target.rotation.z -
                            startRotation.z
                        ) * eased;


                    render();

                    if (
                        progress < 1
                    ) {
                        requestAnimationFrame(
                            animateObject
                        );

                    }

                }
                animateObject();

            }

        }

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function render() {

            renderer.render(
                scene,
                camera
            );

        }

        function animate() {

            requestAnimationFrame(
                animate
            );

            controls.update();

        }

        //Window size
        function onWindowResize() {

            camera.aspect =

                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            render();

        }

        //Sign Out
        document
            .getElementById('signout')
            .addEventListener(
                'click',
                function () {

                    // Get current token
                    const token =
                        gapi.client.getToken();

                    // Revoke Google access
                    if (token) {

                        google.accounts.oauth2.revoke(
                            token.access_token
                        );

                    }

                    // Clear token
                    gapi.client.setToken(null);

                    // Remove all 3D objects
                    objects.forEach(
                        object => {

                            scene.remove(object);

                        }
                    );

                    objects = [];

                    // Reset targets
                    targets = {

                        table: [],
                        sphere: [],
                        helix: [],
                        grid: [],
                        tetrahedron: []

                    };

                    // Hide visualization
                    document.getElementById(
                        'container'
                    ).style.visibility = 'hidden';

                    // Hide Sign Out
                    document.getElementById(
                        'signout'
                    ).style.display = 'none';

                    // Hide authorization
                    document.getElementById(
                        'authorizeButton'
                    ).style.display = 'none';

                    // Change welcome message
                    document.getElementById(
                        'welcomeTitle'
                    ).textContent =
                        'Welcome Back';

                    document.getElementById(
                        'welcomeMessage'
                    ).textContent =
                        'Please sign in with your Google account to continue viewing the 3D data visualization.';

                    // Show login screen
                    document.getElementById(
                        'welcomeOverlay'
                    ).style.display = 'flex';

                    // Reset status
                    document.getElementById(
                        'status'
                    ).textContent =
                        'Please sign in with Google.';

                    render();

                }
            );
